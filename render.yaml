services:
  # Backend API
  - type: web
    name: ayu-disha-backend
    runtime: python
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
    autoDeploy: true

  # Frontend (React/Vite)
  - type: web
    name: ayu-disha-frontend
    runtime: node
    buildCommand: "cd web && npm install && npm run build"
    staticPublishPath: web/dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_BASE_PATH
        value: /
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    autoDeploy: true
